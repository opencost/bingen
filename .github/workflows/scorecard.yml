name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "27 12 * * 4"
  push:
    branches:
      - main

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # OSSF Scorecard only makes sense to run against the default branch's view
    # of the repository (branch-protection rules, dependency policy, etc.).
    # The previous condition also OR'd in 'pull_request', but this workflow's
    # triggers (branch_protection_rule, schedule, push@main) never produce a
    # pull_request event, so that branch was unreachable and just obscured the
    # intent.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: results.sarif
